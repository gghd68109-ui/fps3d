<!DOCTYPE html>
<html>
<head>
    <title>FPS Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <img id="crosshair" src="crosshair.png">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="game3d.js"></script>
</body>
</html>
